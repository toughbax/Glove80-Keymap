CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
CONFIG_EXPERIMENTAL_RGB_LAYER=y
CONFIG_ZMK_POINTING=y
# Report the active layers to the computer over Raw HID (zmk-raw-hid + zmk-hid-viz),
# for the SketchyBar KEYS popup. Key press reports stay off: only layer state is sent.
CONFIG_RAW_HID=y
CONFIG_HID_VIZ=y
CONFIG_HID_VIZ_LAYER_EVENTS=y
CONFIG_HID_VIZ_KEY_EVENTS=n
